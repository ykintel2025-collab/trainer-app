<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trainer JO10</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1f3a93"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: praktisch, langs de lijn met één hand te bedienen
   IDEA: het magneetbord in de dug-out
   PICTURE: het veld met spelers als magneten, groot in de live-weergave
   COLOUR and TYPE: clubblauw dominant, geel accent, gras alleen op het veld; Barlow Condensed + Barlow
   LAYOUT: één kolom, navigatie onderin, invoer via pop-up sheets */
:root{color-scheme:light dark;--bg:light-dark(#f2f4fa,#0c1330);--card:light-dark(#fff,#151f4a);--ink:light-dark(#0f1733,#eef1fb);--mut:light-dark(#5b6584,#9aa5c9);--line:light-dark(#dde2ee,#28346c);--blue:#1f3a93;--blue2:light-dark(#1f3a93,#3d5fd6);--yel:#f6c500;--ok:#17924a;--late:#d98200;--no:#c8323c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;padding-bottom:86px}
header{background:var(--blue);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font:700 26px/1.05 'Barlow Condensed',sans-serif;margin:0;flex:1}
header h1 b{color:var(--yel)}
#sync{font-size:13px;opacity:.85;text-align:right}
main{max-width:720px;margin:0 auto;padding:12px 14px}
h2{font:700 26px/1.1 'Barlow Condensed',sans-serif;margin:14px 0 10px}
h3{font:600 15px/1.3 Barlow,sans-serif;margin:16px 0 8px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
button{font:600 16px Barlow,sans-serif;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.pri{background:var(--blue2);color:#fff;border-color:transparent}
.acc{background:var(--yel);color:#111;border-color:transparent}
.dng{color:var(--no)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.mrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-bottom:8px;min-height:64px;border-radius:14px}
.mrow .t{font:700 22px/1 'Barlow Condensed',sans-serif;width:54px;flex:none}
small,.mut{color:var(--mut);font-size:14px;font-weight:500}
.sc{font:700 24px 'Barlow Condensed',sans-serif;white-space:nowrap}
.tag{display:inline-block;font-size:13px;padding:1px 8px;border-radius:99px;background:var(--line);white-space:nowrap}
.W{background:var(--ok);color:#fff}.G{background:var(--late);color:#fff}.V{background:var(--no);color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;border-radius:0;background:none;min-height:60px;font-size:15px;color:var(--mut);padding:4px}
nav button.on{color:var(--blue2);box-shadow:inset 0 3px 0 var(--yel)}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:4px 0 12px}
.tabs button.on{background:var(--blue2);color:#fff}
.prow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;width:100%}
.seg button{min-height:40px;font-size:14px;padding:4px}
.seg .a.on{background:var(--ok);color:#fff}.seg .l.on{background:var(--late);color:#fff}.seg .x.on{background:var(--no);color:#fff}.seg .z.on{background:#6b7280;color:#fff}
.pitch{position:relative;aspect-ratio:3/4;max-height:64vh;margin:0 auto 10px;background:repeating-linear-gradient(180deg,#2f8f4e 0 12.5%,#2a8246 12.5% 25%);border-radius:14px;overflow:hidden}
.pitch::before{content:"";position:absolute;inset:5%;border:2px solid #ffffffa8;border-radius:3px}
.pitch::after{content:"";position:absolute;left:30%;right:30%;bottom:5%;height:12%;border:2px solid #ffffffa8;border-bottom:0}
.pitch .mid{position:absolute;left:5%;right:5%;top:50%;border-top:2px solid #ffffffa8}
.pitch .cir{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:2px solid #ffffffa8;border-radius:50%;transform:translate(-50%,-50%)}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:0;min-height:0;color:#fff;width:88px;z-index:2}
.dot{width:50px;height:50px;border-radius:50%;background:var(--yel);color:#111;display:grid;place-items:center;font:700 17px 'Barlow Condensed',sans-serif;box-shadow:0 3px 0 #0005;border:2px solid #fff}
.slot.K .dot{background:#fff;color:var(--blue)}
.slot.empty .dot{background:#ffffff33;color:#fff;border-style:dashed}
.slot .nm{font:600 13px/1.15 Barlow,sans-serif;background:#0b1440d0;padding:2px 6px;border-radius:6px;max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .mn{font-size:12px;background:#0b144099;padding:0 5px;border-radius:5px}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.clock{font:700 48px/1 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
.score{font:700 40px/1 'Barlow Condensed',sans-serif;white-space:nowrap;text-align:right}
.bench{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.bench button{flex:none;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.tip{border-color:var(--yel);background:light-dark(#fff8d8,#2b2a12)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;white-space:normal;position:sticky;left:0;background:var(--card)}
th{font-size:13px;color:var(--mut);font-weight:600}
.scroll{overflow-x:auto}
#ov{position:fixed;inset:0;background:#0008;z-index:20;display:none;align-items:flex-end;justify-content:center}
#ov.open{display:flex}
#sh{background:var(--card);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
#sh h2{margin-top:0}
.list button{display:flex;justify-content:space-between;gap:8px;width:100%;margin-bottom:6px;text-align:left}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{font:16px Barlow,sans-serif;width:100%;min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:90px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px}
.empty{color:var(--mut);text-align:center;padding:22px 8px}
.ev{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ev>b:first-child{width:40px;flex:none;font-family:'Barlow Condensed',sans-serif;font-size:20px}
.stat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px}
.stat b{display:block;font:700 28px/1 'Barlow Condensed',sans-serif}
@media (prefers-reduced-motion:no-preference){#sh{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style></head><body>
<header><h1 id="ttl">Trainer <b>JO10</b></h1><span style="text-align:right;line-height:1.1"><span id="sync">laden…</span><br><small style="color:#fff;opacity:.7;font-size:12px">v28</small></span></header>
<main id="app"><p class="empty">Laden…</p></main>
<nav id="nav"><button data-a="nav" data-v="m">Wedstrijden</button><button data-a="nav" data-v="t">Training</button><button data-a="nav" data-v="p">Spelers</button><button data-a="nav" data-v="s">Statistiek</button></nav>
<div id="ov"><div id="sh"></div></div>
<script>
{
const LS='jo10trainer_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));
const FORMS={
 4:{'Ruit':[['A',50,82],['L',22,52],['R',78,52],['S',50,24]]},
 6:{'2-1-2':[['K',50,90],['LV',27,70],['RV',73,70],['M',50,50],['LA',27,25],['RA',73,25]],
    '3-2':[['K',50,90],['LV',18,68],['CV',50,72],['RV',82,68],['LA',32,30],['RA',68,30]],
    '2-2-1':[['K',50,90],['LV',27,72],['RV',73,72],['LM',27,46],['RM',73,46],['SP',50,20]],
    '1-3-1':[['K',50,90],['V',50,72],['LM',18,48],['CM',50,48],['RM',82,48],['SP',50,20]]},
 8:{'3-3-1':[['K',50,90],['LV',20,72],['CV',50,75],['RV',80,72],['LM',20,48],['CM',50,50],['RM',80,48],['SP',50,20]],
    '2-3-2':[['K',50,90],['LV',30,73],['RV',70,73],['LM',18,50],['CM',50,52],['RM',82,50],['LA',32,24],['RA',68,24]]}};
const DAYS=['zo','ma','di','wo','do','vr','za'],MON=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const fdate=d=>{if(!d)return'';const x=new Date(d+'T12:00');return DAYS[x.getDay()]+' '+x.getDate()+' '+MON[x.getMonth()]};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const mmss=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const mins=s=>Math.floor((s||0)/60)+"'";
const minute=t=>t==null?'':(Math.floor(t/60)+1)+"'";

let S={team:{name:'JO10-5',players:[],size:6,form:'2-1-2',per:4,perMin:12.5,u:0},matches:{},trainings:{}};
try{const j=localStorage.getItem(LS);if(j){const o=JSON.parse(j);if(o&&o.team)S=o}}catch(e){}
const U={v:'m',mid:null,mtab:'veld',tid:null};

/* ---------- opslag + sync ---------- */
let db=null,ft=null,busy=false;const dirty=new Set();
const setSync=t=>{$('#sync').textContent=t};
function persist(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function objAt(p){const [c,id]=p.split('/');return c==='team'?S.team:(S[c]||{})[id]}
function touch(p,quiet){const o=objAt(p);if(o)o.u=Date.now();persist();dirty.add(p);clearTimeout(ft);ft=setTimeout(flush,700);if(!quiet)render()}
async function flush(){
 if(!db){setSync('Op dit toestel');return}
 if(busy){clearTimeout(ft);ft=setTimeout(flush,400);return}
 busy=true;setSync('Opslaan…');
 for(const p of [...dirty]){const o=objAt(p);dirty.delete(p);if(!o)continue;
  try{await db.doc(p).set(clone(o))}catch(e){dirty.add(p);busy=false;setSync(e&&e.code==='quota_exceeded'?'Opslag vol':'Offline, probeert opnieuw');clearTimeout(ft);ft=setTimeout(flush,8000);return}}
 busy=false;if(dirty.size){ft=setTimeout(flush,300)}else setSync('Opgeslagen ✓')}
function applyDoc(p,data){if(dirty.has(p)||!data)return false;const l=objAt(p);if(l&&(l.u||0)>=(data.u||0))return false;
 const [c,id]=p.split('/');const d=clone(data);if(c==='team')S.team=d;else S[c][id]=d;return true}
async function connect(){
 try{db=await claude.use('db')}catch(e){db=null}
 if(!db){setSync('Op dit toestel');return}
 const to=setTimeout(()=>setSync('Server nog niet bereikbaar'),10000);
 const seen={};
 const fail=()=>{clearTimeout(to);setSync('Sync gestopt, data blijft op toestel')};
 db.doc('team/main').onSnapshot(s=>{
   if(s.exists&&applyDoc('team/main',s.data())){persist();render()}
   if(!s.metadata.fromCache&&!seen.team){seen.team=1;clearTimeout(to);if(!s.exists&&S.team.u)dirty.add('team/main');if(dirty.size)flush();else setSync('Opgeslagen ✓')}},fail);
 for(const c of ['matches','trainings'])db.collection(c).onSnapshot(q=>{
   let ch=false;const ids=new Set();
   for(const d of q.docs){ids.add(d.id);if(applyDoc(c+'/'+d.id,d.data()))ch=true}
   if(!q.metadata.fromCache&&!seen[c]){seen[c]=1;clearTimeout(to);for(const id in S[c])if(!ids.has(id))dirty.add(c+'/'+id);if(dirty.size)flush()}
   if(ch){persist();render()}},fail);
}

/* ---------- helpers ---------- */
const P=()=>S.team.players.filter(p=>!p.del).sort((a,b)=>(+a.nr||99)-(+b.nr||99)||a.name.localeCompare(b.name));
const pn=id=>{const p=S.team.players.find(x=>x.id===id);return p?p.name:'Onbekend'};
const short=id=>pn(id).split(' ')[0];
const Mall=()=>Object.values(S.matches).filter(m=>!m.del).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
const Ms=()=>Object.values(S.matches).filter(m=>!m.del&&m.kind!=='test').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
const Ts=()=>Object.values(S.trainings).filter(t=>!t.del).sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
const cm=()=>S.matches[U.mid];
const slots=m=>{const f=FORMS[m.size]||FORMS[6];return f[m.form]||Object.values(f)[0]};
const ct=m=>{const c=m.clock;return c.acc+(c.runAt?(Date.now()-c.runAt)/1000:0)};
const pmin=(m,pid,t)=>(m.stints||[]).filter(s=>s.p===pid).reduce((a,s)=>a+((s.b??t)-s.a),0);
const avail=m=>P().filter(p=>m.att[p.id]!=='x'&&m.att[p.id]!=='z');
const onField=m=>Object.values(m.field).filter(Boolean);
const bench=m=>{const f=onField(m);return avail(m).filter(p=>!f.includes(p.id))};
const tracking=m=>m.clock.phase==='live'||m.clock.phase==='rust';
const score=m=>m.man&&m.man.length===2?m.man:[m.events.filter(e=>e.type==='goal').length,m.events.filter(e=>e.type==='tegen').length];
const res=m=>{const [f,a]=score(m);return f>a?'W':f<a?'V':'G'};
const openSt=(m,p,s,t)=>m.stints.push({p,s,a:t,b:null});
const closeSt=(m,p,t)=>{for(const s of m.stints)if(s.p===p&&s.b==null)s.b=t};
const formOpts=(size,form)=>Object.entries(FORMS).map(([n,f])=>Object.keys(f).map(k=>`<option value="${n}|${k}" ${+n===+size&&k===form?'selected':''}>${n} tegen ${n} · ${k}</option>`).join('')).join('');
const save=()=>{const m=cm(),q=U.autoQ;U.autoQ=0;if(m&&m.lu&&q){if(q===actQ(m))m.lu[q]=Object.assign({},m.field);if(q===1&&m.clock.phase==='pre')m.k1=true;if(q<m.per&&m.clock.phase!=='end')makePlan(m,q+1)}touch('matches/'+U.mid)};
const LV={1:'Beginner',2:'Gemiddeld',3:'Sterk',4:'Top'};
const POSN={K:'Keeper',LV:'Linksachter',RV:'Rechtsachter',CV:'Centrale verdediger',V:'Verdediger',LM:'Linkermiddenvelder',RM:'Rechtermiddenvelder',CM:'Centrale middenvelder',M:'Middenvelder',LA:'Linksbuiten',RA:'Rechtsbuiten',SP:'Spits',A:'Achter',L:'Links',R:'Rechts',S:'Spits'};
const usedForm=()=>{if(S.team.coords){const c=S.team.coords.c;return ['LV','CV','RV','LM','CM','RM','LA','SP','RA']}const f=(S.team.ideal&&S.team.ideal.form)||S.team.form,z=+((S.team.ideal&&S.team.ideal.size)||S.team.size);return ((FORMS[z]||FORMS[6])[f]||Object.values(FORMS[z]||FORMS[6])[0]).map(x=>x[0]).filter(c=>c!=='K')};
const PN=m=>m.per===4?'kwart':m.per===2?'helft':'periode';const PA=m=>m.per===4?'K':m.per===2?'H':'P';const fm=x=>String(x).replace('.',',');
const lvl=id=>{const p=S.team.players.find(x=>x.id===id);return +(p&&p.lvl)||2};
const ZD={on:true,from:'2026-11-16',weight:33,win:8,lateBench:true,days:[2,4],time:'18:00',arrive:'17:50',v:2};
function migrate(){if(S.team.fmt!==4){S.team.fmt=4;S.team.per=4;S.team.perMin=12.5;S.team.u=Date.now();const n=Date.now();
 for(const m of Object.values(S.matches))if(m.clock&&m.clock.phase!=='end'&&!(m.stints||[]).some(x=>(x.b??x.a)>x.a)){m.clock={acc:0,runAt:null,half:1,ps:0,phase:'pre'};m.stints=[];m.events=(m.events||[]).filter(e=>e.type!=='wissel');m.per=4;m.perMin=12.5;delete m.plan;m.u=n;setTimeout(()=>dirty.add('matches/'+m.id),0)}
 setTimeout(()=>{dirty.add('team/main');persist();flush()},0)}
if(!S.team.inzet||S.team.inzet.v!==2){S.team.inzet=Object.assign({},S.team.inzet||{},{from:'2026-11-16',weight:33,arrive:'17:50',v:2});S.team.u=Date.now();setTimeout(()=>{dirty.add('team/main');persist();flush()},0)}}
migrate();
const Z=()=>Object.assign({},ZD,S.team.inzet||{});
if(S.team.inzet&&S.team.inzet.v2!==3){S.team.inzet.mode='gelijk';S.team.inzet.v2=3;setTimeout(()=>{S.team.u=Date.now();dirty.add('team/main');persist();flush()},0)}
function ensureTrainings(){const z=Z();if(!z.days||!z.days.length)return;const end=new Date();end.setDate(end.getDate()+7);
 const d=new Date(z.from+'T12:00');let made=false;
 for(let i=0;i<400&&d<=end;i++,d.setDate(d.getDate()+1)){if(!z.days.includes(d.getDay()))continue;
  const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),id='t'+ds.replace(/-/g,'');
  if(!S.trainings[id]){S.trainings[id]={id,date:ds,time:z.time,att:{},note:'',u:0};dirty.add('trainings/'+id);made=true}}
 if(made){persist();clearTimeout(ft);ft=setTimeout(flush,700)}}
function inzet(pid){const z=Z();let n=0,s=0;
 for(const t of Ts()){if(t.date<z.from||t.date>today())continue;const v=t.att[pid];if(!v)continue;if(z.win&&n>=z.win)break;n++;s+=v==='a'?1:v==='l'?.5:0}
 return n?{n,rate:s/n}:null}
function factor(pid){const z=Z();if(!z.on)return 1;const i=inzet(pid);return i?1-(z.weight/100)*(1-i.rate):1}
function targets(m){const n=slots(m).length,len=m.per*m.perMin*60,av=avail(m);const W={};let sw=0;
 for(const p of av){W[p.id]=factor(p.id);sw+=W[p.id]}
 const F=Math.min(n,av.length)*len,T={};for(const p of av)T[p.id]=Math.min(len,Math.max(len/2,sw?F*W[p.id]/sw:0));return {T,len,n,av}}
function suggest(m){const t=ct(m),{T,len,n,av}=targets(m);if(!av.length)return[];
 const def=id=>(T[id]||0)*Math.min(1,t/len)-pmin(m,id,t);
 const avgL=av.reduce((a,p)=>a+lvl(p.id),0)/av.length;
 const fid=onField(m),sumF=fid.reduce((a,id)=>a+lvl(id),0),goal=fid.length*avgL,maxBeg=Math.ceil(n/2);
 const since=id=>{const s=m.stints.find(x=>x.p===id&&x.b==null);return s?t-s.a:9999};
 const out=[];
 for(const [s] of slots(m)){const o=m.field[s];if(!o||s==='K')continue;
  for(const b of bench(m)){const after=sumF-lvl(o)+lvl(b.id),db=Math.abs(after-goal)-Math.abs(sumF-goal);
   let sc=(def(b.id)-def(o))/60-db*2;
   if(since(o)<240)sc-=5;
   if(fid.filter(x=>x!==o).concat(b.id).filter(x=>lvl(x)===1).length>maxBeg)sc-=10;
   out.push({s,o,b:b.id,sc,dB:def(b.id),dO:def(o),bal:db<0?'balans beter':db>0?'balans iets minder':'balans gelijk'})}}
 out.sort((x,y)=>y.sc-x.sc);const seen=new Set(),res=[];
 for(const x of out){if(x.sc<1.5||seen.has(x.b)||seen.has(x.o))continue;seen.add(x.b);seen.add(x.o);res.push(x);if(res.length>=3)break}
 return res}
function starts(pid){return Ms().filter(m=>m.id!==U.mid&&m.stints.some(s=>s.p===pid&&s.a===0)).length}
function autoLineup(m){const sl=slots(m),n=sl.length,av=avail(m),z=Z();if(!av.length)return;
 const avgL=av.reduce((a,p)=>a+lvl(p.id),0)/av.length;
 const pr=p=>(z.lateBench&&m.att[p.id]==='l'?100:0)+starts(p.id)*2-factor(p.id)*3+Math.random()*.5;
 let pool=av.slice().sort((a,b)=>pr(a)-pr(b));const pick=[];
 const kSlot=sl.find(x=>x[0]==='K');let keeper=null;
 if(kSlot){keeper=pool.find(p=>(p.pos||'').toUpperCase().split(/[ ,\/]+/).includes('K'))||null;if(keeper)pool=pool.filter(p=>p!==keeper)}
 let sum=keeper?lvl(keeper.id):0,cnt=keeper?1:0;
 while(pick.length<n-(keeper?1:0)&&pool.length){let best=0,bs=1e9;
  pool.forEach((p,i)=>{const v=Math.abs(sum+lvl(p.id)-(cnt+1)*avgL)+i*.35;if(v<bs){bs=v;best=i}});
  const p=pool.splice(best,1)[0];pick.push(p);sum+=lvl(p.id);cnt++}
 const fld={};if(keeper)fld.K=keeper.id;else if(kSlot&&pick.length){const k=pick.shift();fld.K=k.id}
 const rest=sl.filter(x=>x[0]!=='K').map(x=>x[0]);
 for(const s of rest){let i=pick.findIndex(p=>(p.pos||'').toUpperCase().split(/[ ,\/]+/).includes(s));if(i<0)i=0;if(pick[i]){fld[s]=pick[i].id;pick.splice(i,1)}}
 m.field=fld;save()}

function pairsFor(m,q){const L=(m.lu&&m.lu[q])||{},prev=q===1?{}:(m.lu[q-1]||{}),pv=Object.values(prev),lv=Object.values(L);

 for(const s in L){const i=L[s];if(pv.includes(i))continue;let o=prev[s]&&!lv.includes(prev[s])?prev[s]:null;if(!o||res.some(r=>r.o===o))o=outs.find(x=>!res.some(r=>r.o===x))||null;res.push({s,i,o})}
 return res}

const labOf=(m,s)=>{if(!m.coords)return s;const c=coordsOf(m)[s];return zoneLabel(s,c[0],c[1])};
function relayout(m,c){const L={0:[],1:[],2:[]};for(const s in c){if(s==='K')continue;const y=c[s][1];L[y>=60?0:y>=36?1:2].push(s)}
 const Y=[72,48,22];for(const r in L){const a=L[r].sort((p,q)=>c[p][0]-c[q][0]),n=a.length;a.forEach((s,i)=>{c[s]=[n===1?50:Math.round(18+i*(64/(n-1))),Y[r]]})}

function doSubs(){const m=cm(),pp=U.pop;if(!pp)return;const {h,kind,rows}=pp;let dev=false;
 if(kind==='q'){const nxt=Object.assign({},m.lu[h]||{});
  for(const r of rows){const ch=U.pick[r.o];if(ch&&ch!==r.def){dev=true;const s=Object.keys(nxt).find(k=>nxt[k]===r.def);const s2=Object.keys(nxt).find(k=>nxt[k]===ch);if(s){if(s2)nxt[s2]=r.def;nxt[s]=ch}}}
  setField(m,nxt);m.lu[h]=Object.assign({},nxt)}
 else{const f=Object.assign({},m.field);for(const r of rows){const ch=U.pick[r.o]||r.def,s=Object.keys(f).find(k=>f[k]===r.o);if(ch!==r.def)dev=true;if(s&&ch)f[s]=ch}setField(m,f);
  m.hs[h]=(m.hs[h]||[]).filter(([o])=>!rows.some(r=>r.o===o))}
 U.pop=null;close();if(dev&&h<m.per)makePlan(m,h+1);save()}

function put(s,p){const m=cm(),t=ct(m),old=m.field[s];if(old===p)return;
 const cur=Object.keys(m.field).find(k=>m.field[k]===p);
 if(cur){swap(s,cur);return}
 if(tracking(m)){if(old)closeSt(m,old,t);openSt(m,p,s,t);m.events.push({id:uid(),type:'wissel',t,h:m.clock.half,p,o:old||null})}
 m.field[s]=p;save()}
function swap(s,s2){const m=cm(),t=ct(m),a=m.field[s],b=m.field[s2];
 if(tracking(m)){if(a){closeSt(m,a,t);openSt(m,a,s2,t)}if(b){closeSt(m,b,t);openSt(m,b,s,t)}}
 if(b)m.field[s]=b;else delete m.field[s];if(a)m.field[s2]=a;else delete m.field[s2];save()}
function setForm(v){const m=cm(),[n,f]=v.split('|'),old=slots(m).map(x=>x[0]),t=ct(m);
 const ps=old.map(s=>m.field[s]).filter(Boolean);m.size=+n;m.form=f;const nw=slots(m).map(x=>x[0]);const fld={};
 nw.forEach((s,i)=>{const p=ps[i];if(p){fld[s]=p;if(tracking(m)&&old[i]!==s){closeSt(m,p,t);openSt(m,p,s,t)}}});
 if(tracking(m))ps.slice(nw.length).forEach(p=>closeSt(m,p,t));
 m.field=fld;save()}

  S=o;const n=Date.now();S.team.u=n;dirty.add('team/main');for(const c of ['matches','trainings'])for(const id in S[c]){S[c][id].u=n;dirty.add(c+'/'+id)}persist();flush();close();render()}catch(e){b.textContent='Ongeldige back-up'}},
 del:(d,b)=>{if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Zeker? Tik nogmaals';return}
  close();if(d.k==='players'){const p=S.team.players.find(x=>x.id===d.id);if(p)p.del=true;touch('team/main');return}
  S[d.k][d.id].del=true;if(d.k==='matches')U.v='m';else U.tid=null;touch(d.k+'/'+d.id)},
 close:()=>close()};

U.drag=null;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-drag="1"]');if(!b)return;const pit=b.closest('[data-pitch]');U.drag={b,pit,x0:e.clientX,y0:e.clientY,mv:false}});
document.addEventListener('pointermove',e=>{const d=U.drag;if(!d)return;if(!d.mv&&Math.hypot(e.clientX-d.x0,e.clientY-d.y0)<10)return;d.mv=true;e.preventDefault();const r=d.pit.getBoundingClientRect();
 const x=Math.max(8,Math.min(92,(e.clientX-r.left)/r.width*100)),y=Math.max(12,Math.min(80,(e.clientY-r.top)/r.height*100));d.b.style.left=x+'%';d.b.style.top=y+'%';d.x=x;d.y=y;d.b.style.zIndex=5},{passive:false});
document.addEventListener('pointerup',()=>{const d=U.drag;U.drag=null;if(!d||!d.mv)return;U.noClick=Date.now();const m=cm();if(!m)return;const c=coordsOf(m);c[d.b.dataset.s]=[d.x,d.y];relayout(m,c);
 if(m.lu&&m.clock.phase==='pre'){makePlan(m,m.k1?2:1);if(!m.k1)setField(m,m.lu[1])}save()});
document.addEventListener('click',e=>{if(U.noClick&&Date.now()-U.noClick<400){e.preventDefault();return}if(e.target.id==='ov'){close();return}
 const b=e.target.closest('[data-a]');if(!b)return;const f=act[b.dataset.a];if(f){e.preventDefault();f(b.dataset,b)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&e.target.matches('.prow[data-a]'))e.target.click()});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f)),id=f.dataset.id;
 if(f.dataset.f==='m'){const [n,fm]=d.sf.split('|');let m=id&&S.matches[id];
  if(!m){const nid=uid();U.mtab='aanw';m=S.matches[nid]={id:nid,att:{},field:{},clock:{acc:0,runAt:null,half:1,ps:0,phase:'pre'},stints:[],events:[],note:'',man:null,per:S.team.per,perMin:S.team.perMin}}
  Object.assign(m,{opp:d.opp.trim(),date:d.date,time:d.time,home:d.home==='1',loc:d.loc.trim(),kind:d.kind||'comp'});
  if(+n!==m.size||fm!==m.form){if(m.size){U.mid=m.id;setForm(d.sf)}else{m.size=+n;m.form=fm}}
  m.man=(d.mf!==undefined&&d.mf!==''&&d.ma!=='')?[+d.mf||0,+d.ma||0]:null;
  close();U.v='mx';U.mid=m.id;touch('matches/'+m.id)}
 else if(f.dataset.f==='p'){let p=id&&S.team.players.find(x=>x.id===id);if(!p){p={id:uid()};S.team.players.push(p)}
  Object.assign(p,{name:d.name.trim(),nr:d.nr.trim(),pos:(d.pos||'').trim().replace(/\bK\b/i,'').trim(),gk:!!d.gk,only:Object.keys(d).filter(k=>k.startsWith('only_')).map(k=>k.slice(5)),lvl:+d.lvl||2});close();touch('team/main')}
 else if(f.dataset.f==='s'){const [n,fm]=d.sf.split('|');Object.assign(S.team,{name:d.name.trim(),size:+n,form:fm,per:+d.per,perMin:+String(d.perMin).replace(',','.')||12.5,inzet:{on:!!d.zon,from:d.zfrom||'2026-11-16',weight:+d.zw||33,win:+d.zwin,mode:d.zmode||'gelijk',v:2,v2:3,lateBench:!!d.zlate,days:[1,2,3,4,5].filter(x=>d['zd'+x]),time:d.ztime||'18:00',arrive:d.zarr||'17:50'}});close();touch('team/main')}});
document.addEventListener('change',e=>{const k=e.target.dataset.ch;if(!k)return;const v=e.target.value;
 if(k==='mform')setForm(v);
 else if(k==='mnote'){cm().note=v;touch('matches/'+U.mid,true)}
 else{const t=S.trainings[U.tid];if(!t)return;if(k==='tnote')t.note=v;if(k==='tdate')t.date=v;if(k==='ttime')t.time=v;touch('trainings/'+U.tid,k==='tnote')}});

U.note={};setInterval(()=>{const m0=U.v==='mx'&&cm();if(m0&&m0.clock.phase==='live'&&m0.clock.runAt){const c=m0.clock,k=m0.id+'|'+c.half;
  if(ct(m0)-c.ps>=m0.perMin*60&&!U.note[k]){U.note[k]=1;vib();if(!$('#ov').classList.contains('open'))render()}
  else if(ct(m0)-c.ps>=m0.perMin*30&&!U.note[k+'h']&&((m0.hs&&m0.hs[c.half])||[]).some(([o,i])=>onField(m0).includes(o)&&!onField(m0).includes(i))){U.note[k+'h']=1;vib();if(!$('#ov').classList.contains('open'))render()}}},1000);
setInterval(()=>{if(U.v!=='mx'||U.mtab!=='live')return;const m=cm();if(!m||!m.clock.runAt)return;const t=ct(m);
 const c=document.querySelector('[data-clock]');if(c)c.textContent=mmss(t-m.clock.ps);
 document.querySelectorAll('[data-min]').forEach(el=>{el.textContent=mins(pmin(m,el.dataset.min,t))})},1000);

/* import via link (#import=...) */
try{const h=location.hash;if(h.indexOf('#import=')===0){
 const o=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(h.slice(8))))));const n=Date.now();
 if(o&&o.team){if(!P().length){S.team=Object.assign(o.team,{u:n});dirty.add('team/main')}
  for(const c of ['matches','trainings'])for(const id in (o[c]||{}))if(!S[c][id]){S[c][id]=Object.assign(o[c][id],{u:n});dirty.add(c+'/'+id)}
  persist()}
 migrate();history.replaceState(null,'',location.pathname+location.search)}}catch(e){}
render();connect();
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&location.hostname.endsWith('github.io'))navigator.serviceWorker.register('sw.js')}catch(e){}
}
